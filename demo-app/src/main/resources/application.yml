spring:
  application:
    name: demo-app
  datasource:
    url: jdbc:postgresql://localhost:5432/aidlc
    username: aidlc
    password: aidlc
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: when_missing
      chat:
        model: qwen3:4b
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768

ai:
  dlc:
    rag:
      ingest-on-startup:
        enabled: true
        location-pattern: "classpath:rag-corpus/**/*.md"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
