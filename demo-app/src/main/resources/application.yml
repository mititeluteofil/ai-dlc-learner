spring:
  application:
    name: demo-app
  datasource:
    url: jdbc:postgresql://localhost:5432/aidlc
    username: aidlc
    password: aidlc
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: when_missing
      chat:
        model: qwen3:4b
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768

ai:
  dlc:
    rag:
      ingest-on-startup:
        enabled: true
        location-pattern: "rag-corpus/**/*.md"
    agent:
      memory:
        enabled: true
        max-messages: 20
        # Supported backends: in-memory (default, no DB required), jdbc (uses spring.datasource.*),
        # or pgvector (persists history in the shared RAG PostgreSQL database).
        backend: in-memory
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
